<VirtualHost *:8080>
    DocumentRoot /var/www/PodcastGenerator
    DirectoryIndex index.php
    <Directory /var/www/PodcastGenerator>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    # User-uploaded content must never execute as PHP
    <DirectoryMatch "^/var/www/PodcastGenerator/(media|images)">
        php_admin_flag engine off
        <FilesMatch "\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
