<VirtualHost *:8080>
    DocumentRoot /var/www/PodcastGenerator
    DirectoryIndex index.php
    <Directory /var/www/PodcastGenerator>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
